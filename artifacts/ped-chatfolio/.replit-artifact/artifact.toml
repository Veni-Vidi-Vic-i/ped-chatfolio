kind = "mobile"
previewPath = "/"
title = "PED Chatfolio"
description = "A mobile archive for importing, reading, and searching chat conversations, built as a quiet editorial workspace by PED Corps."
version = "1.0.0"
id = "artifacts/ped-chatfolio"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 19781

[services.development]
run = "pnpm --filter @workspace/ped-chatfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ped-chatfolio", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/ped-chatfolio", "run", "serve" ]

[services.env]
PORT = "19781"
BASE_PATH = "/"
